<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Baseball Audio Test</title>
</head>

<body>
  <h1>Baseball Audio Test</h1>

  <audio id="player" controls preload="auto">
    https://mattyajj.github.io/baseball\_audio/misho.mp3
    このブラウザーでは音声を再生できません。
  </audio>

  <p id="status">読み込み確認中...</p>

  <script>
    const player = document.getElementById("player");
    const status = document.getElementById("status");

    player.addEventListener("loadedmetadata", () => {
      status.textContent =
        "読み込み成功。長さ: " + player.duration.toFixed(1) + "秒";
    });

    player.addEventListener("canplay", () => {
      status.textContent = "再生できます";
    });

    player.addEventListener("error", () => {
      const code = player.error ? player.error.code : "不明";
      status.textContent =
        "音源の読み込みに失敗しました。エラーコード: " + code;
    });
  </script>
</body>
</html>
